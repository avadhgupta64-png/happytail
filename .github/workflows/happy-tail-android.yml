name: Build Happy Tail Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter-wrapper/**"
      - ".github/workflows/happy-tail-android.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-wrapper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch and prepare a crisp, safely padded Happy Tail logo
        run: |
          python3 -m pip install --user --disable-pip-version-check Pillow
          mkdir -p assets
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/avadhgupta64-png/happytail/main/happy-tail/client/public/favicon.png" --output /tmp/happy_tail_source.png
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("/tmp/happy_tail_source.png").convert("RGBA")
          # Preserve the entire original artwork; upscale smoothly and add transparent
          # breathing room so Android adaptive-icon masks do not crop it.
          source.thumbnail((760, 760), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((1024 - source.width) // 2, (1024 - source.height) // 2))
          canvas.save("assets/happy_tail_logo.png", optimize=True)
          print("Prepared logo:", Image.open("assets/happy_tail_logo.png").size)
          PY

      - name: Generate Android and iOS platform projects
        run: flutter create --platforms=android,ios --org com.happytail --project-name happy_tail .

      - name: Set Android launcher label and remove generated placeholder test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="happy_tail"', 'android:label="Happy Tail"')
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" ', 1) if 'xmlns:android=' not in s else s
              s = s.replace('<application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          p.write_text(s)
          # flutter create generates a placeholder test that imports MyApp,
          # but this project entry point is HappyTailApp. Remove that template test.
          Path("test/widget_test.dart").unlink(missing_ok=True)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Generate branded Android and iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-tail-android-apk
          path: flutter-wrapper/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
