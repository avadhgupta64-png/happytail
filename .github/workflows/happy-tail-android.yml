name: Build Happy Tail Android APK
# Rebuild Flutter APK after About page and navigation fixes; preserve the verified logo asset

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter-wrapper/**"
      - ".github/workflows/happy-tail-android.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-wrapper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use the uploaded Happy Tail logo
        run: |
          python3 -m pip install --user --disable-pip-version-check Pillow
          test -s happy_tail_logo_optimized.png
          mkdir -p assets
          cp happy_tail_logo_optimized.png assets/happy_tail_logo.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("assets/happy_tail_logo.png")
          with Image.open(p) as im:
              print(f"Using uploaded logo: {p} ({im.width}x{im.height}, {im.mode})")
              if im.width < 256 or im.height < 256:
                  raise SystemExit("Uploaded logo is unexpectedly small; refusing to build with a tiny logo.")
          PY
      - name: Generate Android and iOS platform projects
        run: flutter create --platforms=android,ios --org com.happytail --project-name happy_tail .

      - name: Set Android compile SDK required by media picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              if "compileSdk = flutter.compileSdkVersion" in s:
                  s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              elif "compileSdkVersion flutter.compileSdkVersion" in s:
                  s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              else:
                  continue
              p.write_text(s)
              print(f"Set compile SDK 36 in {p}")
              break
          else:
              raise SystemExit("Could not find generated Android compileSdk setting")
          PY

      - name: Set Android launcher label and remove generated placeholder test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="happy_tail"', 'android:label="Happy Tail"')
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" ', 1) if 'xmlns:android=' not in s else s
              s = s.replace('<application', '    <application', 1)
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
              'android.permission.READ_EXTERNAL_STORAGE',
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in s:
                  s = s.replace('<application', f'    <uses-permission android:name="{permission}" />\n    <application', 1)
          p.write_text(s)
          # flutter create generates a placeholder test that imports MyApp,
          # but this project entry point is HappyTailApp. Remove that template test.
          Path("test/widget_test.dart").unlink(missing_ok=True)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Generate branded Android and iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK package, SDK compatibility, and signing
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          echo "=== APK file ==="
          ls -lh "$APK"
          echo "=== Package and SDK requirements ==="
          "$AAPT" dump badging "$APK" | head -n 3
          echo "=== Signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "=== APK ZIP integrity ==="
          unzip -t "$APK" | tail -n 2
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-tail-android-apk
          path: flutter-wrapper/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
