name: Android — Flutter APK Build

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/android.yml"

  # Manual trigger — useful for on-demand release builds
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

defaults:
  run:
    working-directory: flutter

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────
      # AGP 8.2 requires Java 17. Use Temurin (Eclipse Adoptium) for
      # the most stable, freely distributable JDK.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── 3. Flutter SDK ───────────────────────────────────────────────────
      # Pin to a specific stable version to prevent silent breaking changes.
      # Update this deliberately when upgrading Flutter.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
          cache-key: flutter-3.22.3-${{ runner.os }}

      # ── 4. Verify toolchain ──────────────────────────────────────────────
      - name: Flutter doctor
        run: flutter doctor -v

      # ── 5. Dependencies ──────────────────────────────────────────────────
      - name: Install Flutter packages
        run: flutter pub get

      # ── 6. Static analysis ───────────────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        # Infos don't block the build; warnings and errors do.

      # ── 7. Unit tests (if any exist) ─────────────────────────────────────
      - name: Flutter test
        run: |
          if find test -name "*_test.dart" 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No tests found — skipping test step"
          fi

      # ── 8. Write local.properties ────────────────────────────────────────
      # The Android build requires this file to locate the Flutter SDK.
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.buildMode=${{ github.event.inputs.build_type || 'release' }}" >> android/local.properties
        env:
          FLUTTER_HOME: ${{ env.FLUTTER_ROOT }}

      # ── 9. Decode signing keystore (release only) ─────────────────────────
      # Store the keystore as a base64 secret KEYSTORE_BASE64.
      # The key alias, store password, and key password are separate secrets.
      # For debug builds or unsigned releases this step is skipped safely.
      - name: Set up release signing
        if: >
          (github.event.inputs.build_type == 'release' || github.event_name == 'push')
          && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          echo "keystore.path=../keystore/release.jks"     >> android/local.properties
          echo "keystore.keyAlias=${{ secrets.KEY_ALIAS }}"           >> android/local.properties
          echo "keystore.keyPassword=${{ secrets.KEY_PASSWORD }}"     >> android/local.properties
          echo "keystore.storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "Keystore decoded and configured ✓"

      # ── 10. Build APK ────────────────────────────────────────────────────
      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug' && github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Build release APK
        if: github.event.inputs.build_type != 'debug' || github.event_name == 'push'
        run: |
          flutter build apk --release \
            --no-tree-shake-icons \
            --split-per-abi
          # split-per-abi produces three smaller APKs:
          # app-arm64-v8a-release.apk  (~most modern devices)
          # app-armeabi-v7a-release.apk (~older devices)
          # app-x86_64-release.apk     (~emulators)

      # ── 11. Verify APK was actually produced ─────────────────────────────
      - name: Verify APK output
        run: |
          echo "Contents of build/app/outputs/:"
          find build/app/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null || true
          echo ""

          # Require at least one APK to exist — fail the job if none found
          APK_COUNT=$(find build/app/outputs -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files found in build output. Build failed."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s) ✓"
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

          # Verify minimum APK size (a valid APK is always > 1 MB)
          for apk in $(find build/app/outputs -name "*.apk"); do
            SIZE=$(stat -c%s "$apk")
            if [ "$SIZE" -lt 1048576 ]; then
              echo "ERROR: APK $apk is suspiciously small ($SIZE bytes). Something is wrong."
              exit 1
            fi
            echo "APK $apk: $(du -sh "$apk" | cut -f1) ✓"
          done

      # ── 12. Upload APK as downloadable artifact ───────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happy-tail-apk-${{ github.sha }}
          path: |
            flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── 13. Summary ──────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "## Happy Tail APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for apk in $(find build/app/outputs -name "*.apk"); do
            SIZE=$(du -sh "$apk" | cut -f1)
            NAME=$(basename "$apk")
            echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
