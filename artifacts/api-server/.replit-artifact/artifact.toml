kind = "api"
previewPath = "/workspace-api"
title = "Happy Tail"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/happy-tail && npm install && npm run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/happy-tail && npm start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
