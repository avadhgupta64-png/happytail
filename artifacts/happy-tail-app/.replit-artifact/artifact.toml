kind = "web"
previewPath = "/"
title = "Happy Tail"
version = "1.0.0"
id = "artifacts/happy-tail-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24183

[services.development]
run = "cd /home/runner/workspace/happy-tail && PORT=24183 npm run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/happy-tail && NODE_ENV=development npm install && npm run build"]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/happy-tail && npm start"]

[services.production.run.env]
PORT = "24183"
NODE_ENV = "production"
