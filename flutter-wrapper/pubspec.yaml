name: happy_tail
description: Happy Tail mobile app wrapper.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  permission_handler: ^11.3.1
  file_picker: ^10.3.3
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/happy_tail_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  # The original transparent Happy Tail logo is used unchanged for the launcher
  # icon (legacy + adaptive foreground) and the in-app header logo. Its
  # transparency, colours and proportions are preserved exactly; nothing is
  # composited, recoloured, cropped or regenerated. The adaptive background is
  # the brand navy (#101827) shown behind the transparent foreground.
  image_path: assets/happy_tail_logo.png
  adaptive_icon_background: '#101827'
  adaptive_icon_foreground: assets/happy_tail_logo.png
