name: happy_tail
description: Happy Tail mobile app wrapper.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  permission_handler: ^11.3.1
  file_picker: ^10.3.3
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/happy_tail_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  # Opaque legacy/round launcher icon: the original transparent logo composited onto
  # the brand navy background. Generated from happy_tail_logo_optimized.png by the
  # build workflow so Android never renders the icon as a white square. The logo
  # artwork itself is unchanged.
  image_path: assets/happy_tail_icon.png
  adaptive_icon_background: '#101827'
  adaptive_icon_foreground: assets/happy_tail_logo.png
