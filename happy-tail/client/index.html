<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets content reach notch/home-indicator edges -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Happy Tail - Tech for Paws, Care for Life</title>
    <meta name="description" content="Meet Happy Tail, your AI-powered dog care companion. Explore dog emotion insights, bark translation, health guidance, diet planning, vet chat, breed guides, and more." />
    <link rel="canonical" href="https://happytail-tan.vercel.app/" />
    <meta name="application-name" content="Happy Tail" />
    <meta property="og:site_name" content="Happy Tail" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Happy Tail - Tech for Paws, Care for Life" />
    <meta property="og:description" content="AI-powered dog care companion. Emotion detection, bark translation, health scan, diet planner, vet chat, breed guides &amp; more." />
    <meta property="og:url" content="https://happytail-tan.vercel.app/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1587300003388-59208cc962cb?q=80&w=1200&auto=format&fit=crop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Happy Tail - Tech for Paws, Care for Life" />
    <meta name="twitter:description" content="Your AI-powered dog care companion. Explore helpful tools for understanding and caring for your dog." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1587300003388-59208cc962cb?q=80&w=1200&auto=format&fit=crop" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Happy Tail" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Happy Tail",
        "alternateName": ["Happy Tail AI", "happytail-tan.vercel.app"],
        "url": "https://happytail-tan.vercel.app/"
      }
    </script>

    <!-- Fonts (trimmed to only what the app uses) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register service worker for PWA offline support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch(function (err) { console.warn('SW registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
